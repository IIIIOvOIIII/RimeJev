# Synthetic regression schema, NOT the Wanxiang distribution or its dictionary.
# Keep this ID because the native probe selects "wanxiang" explicitly.
schema:
  schema_id: wanxiang
  name: Synthetic Jev bridge fixture
  version: '1.0'

engine:
  processors:
    - lua_processor@*jev.paging
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - lua_filter@*jev.bridge

menu:
  page_size: 8
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: bridge_fixture
  prism: bridge_fixture
  enable_user_dict: false
  enable_completion: false
  enable_sentence: false
key_binder:
  bindings:
    - {when: has_menu, accept: Page_Up, send: Page_Up}
    - {when: has_menu, accept: Page_Down, send: Page_Down}

punctuator:
  half_shape:
    ',': '，'
    '.': '。'
  full_shape:
    ',': '，'
    '.': '。'
